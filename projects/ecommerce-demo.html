<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce Demo</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2d;
      --panel-2: #1a2742;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #5b8cff;
      --ok: #16a34a;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #1d2d52, var(--bg) 45%);
      color: var(--text);
    }
    .wrap { width: min(1100px, 92vw); margin: 2rem auto; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .top h1 { margin: 0; }
    .top a { color: #c7d2fe; text-decoration: none; }
    .muted { color: var(--muted); font-size: 0.9rem; margin: 0.3rem 0 0; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 240px);
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: end;
    }
    .field {
      display: grid;
      gap: 0.35rem;
    }
    .field label {
      font-size: 0.82rem;
      color: var(--muted);
    }
    input, select {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: var(--text);
      padding: 0.55rem 0.65rem;
      font: inherit;
    }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      align-items: start;
    }
    .products, .cart {
      background: rgba(17, 26, 45, 0.9);
      border: 1px solid #26324f;
      border-radius: 14px;
      padding: 1rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.8rem;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid #2e406b;
      border-radius: 12px;
      padding: 0.9rem;
      display: grid;
      gap: 0.5rem;
    }
    .pill {
      width: fit-content;
      border: 1px solid #4f5f87;
      border-radius: 999px;
      padding: 0.15rem 0.45rem;
      font-size: 0.72rem;
      color: #bfdbfe;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .price { color: #bfdbfe; font-weight: 700; }
    .stock-ok { color: #86efac; }
    .stock-low { color: #fcd34d; }
    .actions { display: flex; gap: 0.45rem; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 0.5rem 0.72rem;
      color: white;
      background: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: #334155; }
    button.danger { background: #b91c1c; }

    .cart ul { list-style: none; margin: 0; padding: 0; }
    .cart li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
      border-bottom: 1px dashed #334155;
      padding-bottom: 0.6rem;
      color: var(--muted);
    }
    .qty {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      margin-top: 0.25rem;
    }
    .qty button { padding: 0.15rem 0.45rem; border-radius: 8px; }
    .summary {
      display: grid;
      gap: 0.45rem;
      margin-top: 0.8rem;
      font-size: 0.92rem;
    }
    .summary-row { display: flex; justify-content: space-between; color: var(--muted); }
    .summary-row strong { color: #dcfce7; }
    .promo {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.45rem;
      margin-top: 0.8rem;
    }
    .checkout { margin-top: 0.8rem; width: 100%; background: var(--ok); }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>E-Commerce Platform Demo</h1>
        <p class="muted">Search, filter, quantity control, promo code, tax and shipping simulation.</p>
      </div>
      <a href="../Profile.html">Back to Portfolio</a>
    </div>

    <div class="toolbar">
      <div class="field">
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Search products (e.g. Keyboard, USB-C)" />
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="all">All categories</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <section class="products">
        <h2>Products</h2>
        <div id="cards" class="cards"></div>
      </section>

      <aside class="cart">
        <h2>Cart</h2>
        <ul id="cartItems"></ul>

        <div class="promo">
          <input id="promoCode" placeholder="Promo code (TRY: SAVE10)" />
          <button id="applyPromo" class="secondary">Apply</button>
        </div>

        <div class="summary">
          <div class="summary-row"><span>Subtotal</span><span id="subtotal">R0.00</span></div>
          <div class="summary-row"><span>VAT (15%)</span><span id="vat">R0.00</span></div>
          <div class="summary-row"><span>Shipping</span><span id="shipping">R0.00</span></div>
          <div class="summary-row"><span>Discount</span><span id="discount">-R0.00</span></div>
          <div class="summary-row"><strong>Total</strong><strong id="total">R0.00</strong></div>
        </div>

        <button class="checkout" id="checkout">Checkout</button>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const products = [
      { id: 1, name: "Wireless Mouse", price: 299, category: "Accessories", stock: 9, rating: 4.5 },
      { id: 2, name: "Mechanical Keyboard", price: 899, category: "Accessories", stock: 6, rating: 4.8 },
      { id: 3, name: "USB-C Hub", price: 449, category: "Connectivity", stock: 12, rating: 4.3 },
      { id: 4, name: "Monitor Stand", price: 549, category: "Office", stock: 5, rating: 4.1 },
      { id: 5, name: "Noise-Cancel Earbuds", price: 1299, category: "Audio", stock: 7, rating: 4.7 },
      { id: 6, name: "Laptop Sleeve 15\"", price: 389, category: "Office", stock: 14, rating: 4.2 }
    ];

    const format = (value) => `R${value.toFixed(2)}`;
    const TAX_RATE = 0.15;
    const SHIPPING_THRESHOLD = 1200;
    const SHIPPING_FEE = 85;

    const cardsEl = document.getElementById("cards");
    const cartItemsEl = document.getElementById("cartItems");
    const searchEl = document.getElementById("search");
    const categoryEl = document.getElementById("category");
    const toastEl = document.getElementById("toast");

    const cart = JSON.parse(localStorage.getItem("demoCartV2") || "{}");
    let promoApplied = localStorage.getItem("demoPromo") || "";

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function categories() {
      const set = new Set(products.map((p) => p.category));
      for (const c of set) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        categoryEl.appendChild(opt);
      }
    }

    function productMatches(p) {
      const q = searchEl.value.trim().toLowerCase();
      const cat = categoryEl.value;
      const matchesText = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
      const matchesCategory = cat === "all" || p.category === cat;
      return matchesText && matchesCategory;
    }

    function inCartQty(id) {
      return cart[id]?.qty || 0;
    }

    function availableStock(product) {
      return Math.max(product.stock - inCartQty(product.id), 0);
    }

    function renderProducts() {
      cardsEl.innerHTML = "";
      const filtered = products.filter(productMatches);
      if (!filtered.length) {
        cardsEl.innerHTML = "<p class='muted'>No products matched your search.</p>";
        return;
      }

      for (const p of filtered) {
        const stockLeft = availableStock(p);
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <span class="pill">${p.category}</span>
          <h3>${p.name}</h3>
          <div class="price">${format(p.price)}</div>
          <small>⭐ ${p.rating.toFixed(1)} / 5</small>
          <small class="${stockLeft <= 3 ? "stock-low" : "stock-ok"}">${stockLeft > 0 ? `${stockLeft} in stock` : "Out of stock"}</small>
          <div class="actions">
            <button data-id="${p.id}" ${stockLeft === 0 ? "disabled" : ""}>Add to cart</button>
            <button class="secondary" data-quick="${p.id}" ${stockLeft < 2 ? "disabled" : ""}>+2</button>
          </div>
        `;
        cardsEl.appendChild(card);
      }
    }

    function cartEntries() {
      return Object.entries(cart)
        .map(([id, value]) => {
          const product = products.find((p) => p.id === Number(id));
          return product ? { product, qty: value.qty } : null;
        })
        .filter(Boolean);
    }

    function calcTotals() {
      const entries = cartEntries();
      const subtotal = entries.reduce((sum, e) => sum + e.product.price * e.qty, 0);
      const vat = subtotal * TAX_RATE;
      const shipping = subtotal > 0 && subtotal < SHIPPING_THRESHOLD ? SHIPPING_FEE : 0;
      const discount = promoApplied === "SAVE10" ? subtotal * 0.10 : 0;
      return { subtotal, vat, shipping, discount, total: subtotal + vat + shipping - discount };
    }

    function saveState() {
      localStorage.setItem("demoCartV2", JSON.stringify(cart));
      localStorage.setItem("demoPromo", promoApplied);
    }

    function renderCart() {
      cartItemsEl.innerHTML = "";
      const entries = cartEntries();
      for (const { product, qty } of entries) {
        const li = document.createElement("li");
        li.innerHTML = `
          <div>
            <strong>${product.name}</strong>
            <div class="qty">
              <button class="secondary" data-op="dec" data-id="${product.id}">−</button>
              <span>${qty}</span>
              <button class="secondary" data-op="inc" data-id="${product.id}">+</button>
              <button class="danger" data-op="remove" data-id="${product.id}">Remove</button>
            </div>
          </div>
          <strong>${format(product.price * qty)}</strong>
        `;
        cartItemsEl.appendChild(li);
      }
      if (!entries.length) {
        const li = document.createElement("li");
        li.textContent = "Your cart is empty";
        cartItemsEl.appendChild(li);
      }

      const totals = calcTotals();
      document.getElementById("subtotal").textContent = format(totals.subtotal);
      document.getElementById("vat").textContent = format(totals.vat);
      document.getElementById("shipping").textContent = format(totals.shipping);
      document.getElementById("discount").textContent = `-${format(totals.discount)}`;
      document.getElementById("total").textContent = format(totals.total);

      saveState();
    }

    function addToCart(productId, qty = 1) {
      const product = products.find((p) => p.id === productId);
      if (!product) return;
      const current = inCartQty(productId);
      if (current + qty > product.stock) {
        showToast("Cannot add beyond available stock.");
        return;
      }
      cart[productId] = { qty: current + qty };
      renderProducts();
      renderCart();
      showToast(`${product.name} added to cart`);
    }

    cardsEl.addEventListener("click", (event) => {
      const addBtn = event.target.closest("button[data-id]");
      const quickBtn = event.target.closest("button[data-quick]");
      if (addBtn) addToCart(Number(addBtn.dataset.id), 1);
      if (quickBtn) addToCart(Number(quickBtn.dataset.quick), 2);
    });

    cartItemsEl.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-op]");
      if (!btn) return;
      const id = Number(btn.dataset.id);
      if (!cart[id]) return;
      if (btn.dataset.op === "inc") addToCart(id, 1);
      if (btn.dataset.op === "dec") {
        cart[id].qty -= 1;
        if (cart[id].qty <= 0) delete cart[id];
        renderProducts();
        renderCart();
      }
      if (btn.dataset.op === "remove") {
        delete cart[id];
        renderProducts();
        renderCart();
      }
    });

    document.getElementById("applyPromo").addEventListener("click", () => {
      const code = document.getElementById("promoCode").value.trim().toUpperCase();
      promoApplied = code === "SAVE10" ? code : "";
      renderCart();
      showToast(promoApplied ? "Promo applied: 10% off." : "Invalid promo code.");
    });

    document.getElementById("checkout").addEventListener("click", () => {
      const entries = cartEntries();
      if (!entries.length) {
        alert("Cart is empty.");
        return;
      }
      const totals = calcTotals();
      alert(`Checkout completed (demo). Charged ${format(totals.total)}.`);
      Object.keys(cart).forEach((k) => delete cart[k]);
      promoApplied = "";
      document.getElementById("promoCode").value = "";
      renderProducts();
      renderCart();
    });

    searchEl.addEventListener("input", renderProducts);
    categoryEl.addEventListener("change", renderProducts);

    categories();
    renderProducts();
    renderCart();
  </script>
</body>
</html>
