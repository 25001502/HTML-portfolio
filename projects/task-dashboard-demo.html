<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Dashboard Demo</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182d;
      --line: #2a3657;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0b1020, #101826 40%, #121e36);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
    }
    .wrap { width: min(1100px, 100%); margin: 0 auto; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .top a { color: #bfdbfe; text-decoration: none; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
    }
    .col {
      background: rgba(17, 24, 45, 0.92);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.75rem;
      min-height: 450px;
    }
    .col h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      color: #c7d2fe;
    }
    .task {
      background: #1b2643;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.65rem;
      margin-bottom: 0.55rem;
      cursor: grab;
    }
    .task strong { display: block; margin-bottom: 0.25rem; }
    .task small { color: var(--muted); }
    .col.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: 2px;
    }
    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr; }
      .col { min-height: 220px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Task Management Dashboard Demo</h1>
      <a href="../Profile.html">Back to Portfolio</a>
    </div>

    <div class="board">
      <section class="col" data-column="todo">
        <h2>To Do</h2>
        <article class="task" draggable="true">
          <strong>Design login page</strong>
          <small>Priority: High</small>
        </article>
        <article class="task" draggable="true">
          <strong>Set up Firebase auth</strong>
          <small>Priority: Medium</small>
        </article>
      </section>

      <section class="col" data-column="doing">
        <h2>In Progress</h2>
        <article class="task" draggable="true">
          <strong>Build user dashboard</strong>
          <small>Priority: High</small>
        </article>
      </section>

      <section class="col" data-column="done">
        <h2>Done</h2>
        <article class="task" draggable="true">
          <strong>Create project repository</strong>
          <small>Completed today</small>
        </article>
      </section>
    </div>
  </div>

  <script>
    let dragged = null;

    document.addEventListener("dragstart", (event) => {
      const task = event.target.closest(".task");
      if (!task) return;
      dragged = task;
      event.dataTransfer.effectAllowed = "move";
    });

    document.addEventListener("dragend", () => {
      dragged = null;
      document.querySelectorAll(".col").forEach((col) => col.classList.remove("drag-over"));
    });

    document.querySelectorAll(".col").forEach((col) => {
      col.addEventListener("dragover", (event) => {
        event.preventDefault();
        col.classList.add("drag-over");
      });

      col.addEventListener("dragleave", () => {
        col.classList.remove("drag-over");
      });

      col.addEventListener("drop", (event) => {
        event.preventDefault();
        col.classList.remove("drag-over");
        if (!dragged) return;
        col.appendChild(dragged);
      });
    });
  </script>
</body>
</html>
