<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App Demo</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3b82f6;
      --other: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background: linear-gradient(140deg, #0d1117, #111827);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .chat {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
    }
    .head {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .head a { color: #93c5fd; text-decoration: none; }
    .messages {
      height: 420px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: repeating-linear-gradient(
        to bottom,
        #131a24,
        #131a24 32px,
        #121822 32px,
        #121822 64px
      );
    }
    .bubble {
      max-width: 78%;
      padding: 0.6rem 0.75rem;
      border-radius: 12px;
      line-height: 1.45;
    }
    .me {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: var(--other);
      color: var(--text);
      border: 1px solid #374151;
      border-bottom-left-radius: 4px;
    }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .input {
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      padding: 0.75rem;
    }
    input {
      width: 100%;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 0.65rem;
      background: #0f172a;
      color: var(--text);
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="chat">
    <header class="head">
      <strong>Real-Time Chat Demo</strong>
      <a href="../Profile.html">Back to Portfolio</a>
    </header>

    <main class="messages" id="messages"></main>

    <form class="input" id="chatForm">
      <input id="chatInput" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("chatInput");

    function now() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function addMessage(text, who) {
      const wrap = document.createElement("article");
      const bubble = document.createElement("div");
      const meta = document.createElement("div");
      bubble.className = `bubble ${who}`;
      bubble.textContent = text;
      meta.className = "meta";
      meta.textContent = `${who === "me" ? "You" : "Bot"} • ${now()}`;
      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    const botReplies = [
      "Nice message. In the real app this would be pushed over WebSockets.",
      "Typing indicators and read receipts can be layered on top of this flow.",
      "This demo stores no history, but your production version can persist chats.",
      "You can connect this to Firebase, Socket.IO, or Supabase Realtime quickly."
    ];

    addMessage("Welcome to the chat demo. Send a message to test it.", "bot");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "me");
      input.value = "";

      const reply = botReplies[Math.floor(Math.random() * botReplies.length)];
      setTimeout(() => addMessage(reply, "bot"), 500);
    });
  </script>
</body>
</html>
