<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App Demo</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3b82f6;
      --ok: #10b981;
      --other: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background: linear-gradient(140deg, #0d1117, #111827);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .chat {
      width: min(920px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--panel), #111827);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 620px;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.35);
      padding: 0.75rem;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 0.55rem;
    }
    .rooms { display: grid; gap: 0.35rem; }
    .room {
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #dbeafe;
      padding: 0.5rem;
      text-align: left;
      cursor: pointer;
    }
    .room.active { border-color: #60a5fa; background: #1e293b; }

    .main {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-width: 0;
    }
    .head {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .status { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--muted); font-size: 0.8rem; }
    .back-link {
      color: #93c5fd;
      text-decoration: none;
    }
    .back-link:hover { color: #bfdbfe; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
    }
    .toolbar {
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
      padding: 0.6rem 0.75rem;
      background: rgba(2, 6, 23, 0.45);
    }
    input, .search {
      width: 100%;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      background: #0f172a;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
    }
    .mini-btn {
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 0.45rem 0.58rem;
      font-size: 0.76rem;
      font-weight: 700;
      background: #111827;
      color: var(--text);
      cursor: pointer;
    }
    .messages {
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: repeating-linear-gradient(
        to bottom,
        #131a24,
        #131a24 32px,
        #121822 32px,
        #121822 64px
      );
    }
    .bubble {
      max-width: 78%;
      padding: 0.6rem 0.75rem;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .me { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--other); color: var(--text); border: 1px solid #374151; border-bottom-left-radius: 4px; }
    .meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }
    .typing {
      align-self: flex-start;
      color: var(--muted);
      font-size: 0.8rem;
      background: rgba(2, 6, 23, 0.5);
      border: 1px solid #374151;
      border-radius: 999px;
      padding: 0.3rem 0.6rem;
      display: none;
    }
    .typing.show { display: inline-flex; }

    .input {
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.75rem;
      background: rgba(2, 6, 23, 0.35);
    }
    .quick { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      border: 1px solid #374151;
      border-radius: 999px;
      padding: 0.25rem 0.55rem;
      font-size: 0.72rem;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.7);
      cursor: pointer;
    }
    .form-row { display: grid; grid-template-columns: 1fr auto; gap: 0.6rem; }
    .send {
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 760px) {
      .chat { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .toolbar, .form-row { grid-template-columns: 1fr; }
      .send { width: 100%; }
    }
  </style>
</head>
<body>
  <section class="chat">
    <aside class="sidebar">
      <strong>Channels</strong>
      <input id="roomSearch" class="search" placeholder="Search channel" />
      <div id="rooms" class="rooms"></div>
    </aside>

    <div class="main">
      <header class="head">
        <div>
          <strong id="roomTitle"># general</strong>
          <div class="status"><span class="dot"></span><span id="presence">3 members online</span></div>
        </div>
        <a href="../Profile.html" class="back-link">Back to Portfolio</a>
      </header>

      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="Search messages" />
        <button id="clearBtn" class="mini-btn">Clear Channel</button>
      </div>

      <main id="messages" class="messages"></main>

      <section class="input">
        <div class="quick">
          <button class="chip" data-chip="Can we ship this by Friday?">Deadline check</button>
          <button class="chip" data-chip="Please share the latest API docs.">Docs request</button>
          <button class="chip" data-chip="Let's do a quick standup in 10 mins.">Standup</button>
        </div>

        <div id="typing" class="typing">Bot is typing…</div>

        <form id="form" class="form-row">
          <input id="msg" placeholder="Type a message" autocomplete="off" required />
          <button class="send" type="submit">Send</button>
        </form>
      </section>
    </div>
  </section>

  <script>
    const defaultRooms = ["general", "frontend", "backend", "support"];
    const storageKey = "chatRoomsV2";
    const rooms = JSON.parse(localStorage.getItem(storageKey) || "null") || {};

    for (const room of defaultRooms) {
      rooms[room] ||= [
        { from: "bot", text: `Welcome to #${room}.`, at: Date.now() - 60000 },
        { from: "bot", text: `This is a realistic chat flow demo for the ${room} channel.`, at: Date.now() - 30000 }
      ];
    }

    let currentRoom = "general";

    const roomsEl = document.getElementById("rooms");
    const roomTitleEl = document.getElementById("roomTitle");
    const messagesEl = document.getElementById("messages");
    const searchEl = document.getElementById("search");
    const presenceEl = document.getElementById("presence");
    const typingEl = document.getElementById("typing");
    const msgEl = document.getElementById("msg");
    const roomSearchEl = document.getElementById("roomSearch");

    function save() {
      localStorage.setItem(storageKey, JSON.stringify(rooms));
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function filteredRooms() {
      const q = roomSearchEl.value.trim().toLowerCase();
      return Object.keys(rooms).filter((room) => !q || room.includes(q));
    }

    function renderRooms() {
      roomsEl.innerHTML = "";
      for (const room of filteredRooms()) {
        const btn = document.createElement("button");
        btn.className = `room ${room === currentRoom ? "active" : ""}`;
        btn.dataset.room = room;
        btn.textContent = `# ${room}`;
        roomsEl.appendChild(btn);
      }
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      const q = searchEl.value.trim().toLowerCase();
      const messages = rooms[currentRoom].filter((m) => !q || m.text.toLowerCase().includes(q));

      for (const m of messages) {
        const bubble = document.createElement("article");
        bubble.className = `bubble ${m.from === "me" ? "me" : "bot"}`;
        bubble.innerHTML = `<div>${m.text}</div><div class="meta">${m.from === "me" ? "You" : "Bot"} • ${formatTime(m.at)}</div>`;
        messagesEl.appendChild(bubble);
      }
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      roomTitleEl.textContent = `# ${currentRoom}`;
      presenceEl.textContent = `${2 + Math.floor(Math.random() * 4)} members online`;
    }

    function botReply(userText) {
      const intent = userText.toLowerCase();
      if (intent.includes("deadline") || intent.includes("friday")) return "We can deliver by Friday if QA signs off by Thursday noon.";
      if (intent.includes("api") || intent.includes("docs")) return "Shared latest docs in #backend and pinned them for the sprint.";
      if (intent.includes("bug") || intent.includes("error")) return "Thanks — I created a bug ticket and tagged the on-call engineer.";
      return "Got it. I logged this update and notified the team in this channel.";
    }

    function sendMessage(text) {
      const clean = text.trim();
      if (!clean) return;
      rooms[currentRoom].push({ from: "me", text: clean, at: Date.now() });
      save();
      renderMessages();

      typingEl.classList.add("show");
      setTimeout(() => {
        typingEl.classList.remove("show");
        rooms[currentRoom].push({ from: "bot", text: botReply(clean), at: Date.now() });
        save();
        renderMessages();
      }, 850);
    }

    roomsEl.addEventListener("click", (event) => {
      const roomBtn = event.target.closest("button[data-room]");
      if (!roomBtn) return;
      currentRoom = roomBtn.dataset.room;
      renderRooms();
      renderMessages();
    });

    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(msgEl.value);
      msgEl.value = "";
      msgEl.focus();
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => sendMessage(chip.dataset.chip));
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm(`Clear all messages in #${currentRoom}?`)) return;
      rooms[currentRoom] = [];
      save();
      renderMessages();
    });

    searchEl.addEventListener("input", renderMessages);
    roomSearchEl.addEventListener("input", renderRooms);

    renderRooms();
    renderMessages();
  </script>
</body>
</html>
